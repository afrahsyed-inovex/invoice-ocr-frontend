services:
  frontend:
    build: .
    image: invoice-ocr-frontend:latest
    container_name: invoice-ocr-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    # Values come from .env when present, otherwise the defaults below.
    environment:
      VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
      VITE_MUNHIM_API_URL: ${VITE_MUNHIM_API_URL:-http://localhost:8000}
      VITE_USMAN_API_URL: ${VITE_USMAN_API_URL:-http://localhost:8001}
      VITE_REQUEST_TIMEOUT_MS: ${VITE_REQUEST_TIMEOUT_MS:-60000}
    restart: unless-stopped
